name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta todos los días a medianoche
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para hacer commit de los cambios en el README/SVG
    
    steps:
      - uses: actions/checkout@v4

     # Aquí puedes añadir un script tuyo en Python o una action que regenere la imagen
      # Por ejemplo, si usas scripts propios con Pillow/Matplotlib que ya dominas:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate local stats image
        run: |
          python -m pip install matplotlib pillow
          # Ejecutas tu script que genera la gráfica y la guarda en ./assets/stats.svg
          python scripts/generate_stats.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update profile metrics"
          file_pattern: "assets/*.svg"
          
